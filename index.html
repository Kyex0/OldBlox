<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OldBlox - Loading...</title>
    <style>
        /* Стиль в духе старого Роблокса */
        body {
            background-color: #f2f2f2;
            font-family: "Lucida Grande", "Lucida Sans Unicode", Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .loader-box {
            background: white;
            border: 1px solid #c3c3c3;
            padding: 30px;
            text-align: center;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff0000; /* Старый красный цвет ROBLOX */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 18px;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 13px;
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="loader-box">
        <h2>Connecting to OldBlox...</h2>
        <div class="spinner"></div>
        <p>Please wait a moment.</p>
    </div>

    <script>
        // Через 2 секунды (2000 миллисекунд) сайт сам перейдет на страницу регистрации
        setTimeout(function() {
            window.location.href = "./register.html";
        }, 2000);
    </script>

</body>
</html>
